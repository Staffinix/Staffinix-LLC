services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: staffinix-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - staffinix_qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.34.1
    container_name: staffinix-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - staffinix_ollama_data:/root/.ollama

volumes:
  staffinix_qdrant_data:
  staffinix_ollama_data:
