services:
  document-gateway:
    image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports:
      - "127.0.0.1:8788:8080"
    volumes:
      - ./workers/document-processor/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - document-processor
    networks:
      - processing
      - gateway-egress
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 32
    restart: "no"

  document-processor:
    build:
      context: .
      dockerfile: workers/document-processor/Dockerfile
    environment:
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:?Run the local document setup first}
      PORT: "8788"
    networks:
      - processing
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: "no"

networks:
  processing:
    internal: true
  gateway-egress: {}
