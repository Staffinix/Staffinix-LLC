title = "Staffinix Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic publishable-key rejection fixture in the initial import"
condition = "AND"
commits = ["66807844f20d634f15cb26fae6b8e1c1b90dd6b8"]
paths = ['''^src/integrations/supabase/auth-header\.test\.ts$''']
targetRules = ["generic-api-key"]

[[allowlists]]
description = "Synthetic compact-JWT parser fixture used by the authentication unit test"
condition = "AND"
paths = ['''(^|[/\\])src[/\\]integrations[/\\]supabase[/\\]auth-header\.test\.ts$''']
regexTarget = "match"
regexes = ['''validToken\s*=\s*"eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ1c2VyLWlkIn0\.signature"''']
targetRules = ["generic-api-key"]
