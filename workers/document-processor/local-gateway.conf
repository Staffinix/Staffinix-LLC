server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;
    access_log off;

    location / {
        proxy_pass http://document-processor:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 20s;
    }
}
